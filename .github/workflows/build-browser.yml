name: Build browser installers

# Build the unk desktop browser for macOS, Windows and Linux.
# Triggers on a version tag (e.g. v0.1.0) or manually from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # lets the workflow publish the GitHub Release
  id-token: write # provenance attestations ("don't trust, verify")
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # `npm install` (not `npm ci`) so it works even if the lockfile predates
      # the electron-builder devDependency.
      - run: npm install

      - run: npm run dist
        env:
          # Disable code signing for now (unsigned builds are fine for testing).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Checksums
        shell: bash
        run: |
          cd browser/dist
          (sha256sum *.dmg *.exe *.AppImage 2>/dev/null || shasum -a 256 *.dmg *.exe *.AppImage 2>/dev/null) > SHA256SUMS-${{ matrix.os }}.txt || true
          cat SHA256SUMS-${{ matrix.os }}.txt

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            browser/dist/*.dmg
            browser/dist/*.exe
            browser/dist/*.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: unk-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            browser/dist/*.dmg
            browser/dist/*.exe
            browser/dist/*.AppImage
            browser/dist/SHA256SUMS-*.txt

      # On a version tag, publish the installers as a GitHub Release
      # (each OS job appends its own asset to the same release).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            browser/dist/*.dmg
            browser/dist/*.exe
            browser/dist/*.AppImage
            browser/dist/SHA256SUMS-*.txt
