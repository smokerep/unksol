    <radialGradient id="haze" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#14F195" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#9945FF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#9945FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="#000000"/>
  <rect width="512" height="512" rx="116" fill="url(#haze)"/>
